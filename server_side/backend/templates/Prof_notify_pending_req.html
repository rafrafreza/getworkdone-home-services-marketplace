<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Daily Reminder: Pending Service Requests</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 0;">
    <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="background-color: #f4f4f4; padding: 20px;">
        <tr>
            <td align="center">
                <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="600" style="background-color: #ffffff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);">
                    <tr>
                        <td>
                            <h2 style="color: #333;">Hello {{ professional_name }},</h2>
                            <p style="font-size: 16px; color: #666;">
                                You have <span style="font-size: 18px; font-weight: bold; color: #2c3e50;">{{ pending_count }}</span> pending service requests waiting for your response.
                            </p>
                            <p style="font-size: 16px; color: #666;">Please take action by accepting or rejecting them in your dashboard:</p>
                            <p>
                                <a href="{{ dashboard_link }}" style="display: inline-block; padding: 10px 20px; margin-top: 20px; background-color: #007bff; color: #ffffff; text-decoration: none; border-radius: 5px;">
                                    View Requests
                                </a>
                            </p>
                            <p style="margin-top: 20px; font-size: 12px; color: #999; text-align: center;">
                                This is an automated email. Please do not reply.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
