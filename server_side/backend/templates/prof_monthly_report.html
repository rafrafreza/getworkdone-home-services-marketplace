<!DOCTYPE html>
<html>
<body style="font-family: Arial, sans-serif; background-color: #1e1e2d; margin: 0; padding: 0; text-align: center;">
    
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color: #1e1e2d; padding: 20px 0;">
        <tr>
            <td align="center">
                <table role="presentation" width="90%" max-width="600px" cellspacing="0" cellpadding="0" border="0" 
                    style="background-color: #2c2c44; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3); color: #ffffff;">
                    
                    <tr>
                        <td align="center">
                            <h2 style="color: #f9c74f; font-size: 24px; margin-bottom: 10px;">Hello {{ professional_name }},</h2>
                            <p style="font-size: 16px; color: #ddd; line-height: 1.6;">
                                Here is your <strong>Monthly Service Activity Report</strong>:
                            </p>
                        </td>
                    </tr>

                    <tr>
                        <td align="center">
                            <table role="presentation" width="100%" cellspacing="0" cellpadding="10" border="0" 
                                style="background: #39395b; padding: 15px; border-radius: 10px; margin: 20px 0;">
                                <tr>
                                    <td align="center" style="font-size: 18px; font-weight: bold; padding: 8px 0; color: #ffffff;">
                                        ✔ Completed Services: <span style="color: #f9c74f;">{{ completed_services }}</span>
                                    </td>
                                </tr>
                                <tr>
                                    <td align="center" style="font-size: 18px; font-weight: bold; padding: 8px 0; color: #ffffff;">
                                        ⏳ Pending Services: <span style="color: #f9c74f;">{{ pending_services }}</span>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <tr>
                        <td align="center">
                            <p style="font-size: 16px; color: #ddd;">Click the button below to view full details:</p>
                            <a href="{{ dashboard_link }}" 
                                style="display: inline-block; padding: 12px 24px; margin-top: 20px; background: #f9c74f; color: #1e1e2d; 
                                       text-decoration: none; font-weight: bold; font-size: 16px; border-radius: 8px;">
                                View Dashboard
                            </a>
                        </td>
                    </tr>

                    <tr>
                        <td align="center" style="padding-top: 20px;">
                            <p style="font-size: 14px; color: #aaa;">
                                Thank you for being a valued professional in our network! 🚀
                            </p>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>

</body>
</html>
